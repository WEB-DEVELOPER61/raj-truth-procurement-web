name: Daily Procurement Audit Pipeline

on:
  schedule:
    # Runs automatically every day at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows one-click manual testing from the Actions tab

jobs:
  audit-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ingestion Dependencies
        run: |
          pip install requests beautifulsoup4 pandas numpy

      - name: Run Daily Scraper
        run: python daily_scraper.py

      - name: Commit and Push New Tenders
        run: |
          git config --global user.name "Project-TRUTH-Vigilance-Bot"
          git config --global user.email "bot@projecttruth.internal"
          git add data/districts/
          # Only commits if new rows were added to district files
          git diff --staged --quiet || (git commit -m "Auto-Audit: Ingested fresh statutory notices [$(date +'%Y-%m-%d')]" && git push)