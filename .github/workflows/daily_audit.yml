name: Project TRUTH Automated Audit

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (5:30 AM IST) with zero human intervention
    - cron: "0 0 * * *"
  # Lets you trigger a live cloud run in front of a judge with one click
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifiable-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Audit Dependencies
        run: |
          pip install duckdb pandas scikit-learn requests beautifulsoup4

      - name: Execute Scraper, DuckDB Audit & RFC 6962 Merkle Tree
        run: python run_audit.py

      - name: Seal Merkle Root via GitHub Actions Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merkle_root.json data/districts
          git diff --staged --quiet || git commit -m "chore(audit): seal RFC 6962 Merkle Root [automated]"
          git push
