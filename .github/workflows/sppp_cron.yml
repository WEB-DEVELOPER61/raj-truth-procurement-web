name: SPPP Rajasthan Automated Ingestion Pipeline

on:
  schedule:
    # Runs daily at 01:00 UTC (06:30 AM IST)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger via GitHub button

jobs:
  harvest-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ingestion Dependencies
        run: |
          pip install requests beautifulsoup4 pandas

      - name: Execute Statewide Harvest Worker
        run: |
          python scripts/sppp_scraper.py

      - name: Commit and Push New Procurement Snapshots
        run: |
          git config --global user.name "Project-TRUTH-Bot"
          git config --global user.email "bot@projecttruth.internal"
          git add data/districts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync official SPPP procurement corpus [skip ci]" && git push)
