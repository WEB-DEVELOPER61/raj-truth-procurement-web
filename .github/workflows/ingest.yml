name: Expand Procurement Corpus

on:
  workflow_dispatch: # Allows manual one-click trigger from GitHub UI

jobs:
  run-expansion:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy

      - name: Run expansion script
        run: |
          python fetch_tenders.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Project-TRUTH-Bot"
          git config --global user.email "bot@projecttruth.internal"
          git add data/ *.csv
          git diff --staged --quiet || (git commit -m "Auto-Expand: Scaled empirical corpus to 650 notices" && git push)
